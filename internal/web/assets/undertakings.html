<article class="prose">

    <h1>What Porch<br>undertakes.</h1>

    <p class="lede">
      Porch adds these to
      <a href="{{.SiteBase}}/organisation">denyfirst&rsquo;s undertakings</a>.
      Each one says how you can check it.
    </p>

    <dl class="undertakings">
      {{range .Product.Adds}}
      <dt id="{{.ID}}">{{.Says}}</dt>
      <dd><strong>How you check it.</strong> {{.Checked}}</dd>
      {{end}}
    </dl>

  </article>
