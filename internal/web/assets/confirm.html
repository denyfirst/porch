<section class="signin">

  <!--
    Confirm it's you: what a change to how this installation is signed into
    asks for when the session was opened, or last confirmed, more than ten
    minutes ago. A session left open on a shared screen reads the pages; it
    does not turn the second factor off or change the password.

    With the second factor on, the answer is a code from the app or a
    recovery code; without it, the password. Five wrong answers end the
    session. The page is behind the gate: it is for somebody signed in.
  -->
  <p class="signin-mark"><span class="wordmark">porch<span class="wordmark-porch-stop">.</span></span></p>

  <form class="panel signin-form" id="confirm-form" autocomplete="off">
    <a class="signin-back" href="/security"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg>Back to Security</a>
    <div class="signin-head">
      <div>
        <h1>Confirm it's you</h1>
        <p class="signin-sub">Changing how this installation is signed into needs a fresh confirmation. You won't be asked again for 10 minutes.</p>
      </div>
    </div>
    <div class="signin-field" id="confirm-code-row" hidden>
      <label class="field-label" for="confirm-code" id="confirm-code-label">Code from your authenticator app</label>
      <div class="digits">
        <input class="field code-field" type="text" id="confirm-code" inputmode="numeric"
          autocomplete="one-time-code" maxlength="40" spellcheck="false" autocapitalize="off">
      </div>
      <button class="signin-switch" type="button" id="confirm-recovery">Use a recovery code instead</button>
    </div>
    <div class="signin-field" id="confirm-password-row" hidden>
      <label class="field-label" for="confirm-password">Password</label>
      <input class="field" type="password" id="confirm-password" autocomplete="current-password">
    </div>
    <button class="submit" type="submit" id="confirm-submit" disabled>Confirm</button>
    <p class="signin-status" id="confirm-status" role="status">Asking the installation…</p>
    <p class="signin-note">Five wrong answers end this session, and signing in starts again with the password.</p>
  </form>

</section>
